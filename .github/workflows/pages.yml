name: Deploy Spain travel guide to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize published static data
        run: node trip-guide-ui/scripts/sync-static-site.mjs

      - name: Validate the published app shell
        run: |
          node --check trip-guide-ui/site/app.js
          test -f trip-guide-ui/site/index.html
          test -f trip-guide-ui/site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: trip-guide-ui/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
